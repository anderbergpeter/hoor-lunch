<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lunch i Höör</title>

  <!-- Pico.css: clean, modern defaults with dark-mode support -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
  />

  <style>
    :root { --pico-font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    header.hero {
      padding: 2.25rem 0 1rem;
      border-bottom: 1px solid var(--pico-muted-border-color);
      margin-bottom: 1.25rem;
    }
    .subtle { color: var(--pico-muted-color); }
    .meta { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
    .badge {
      display:inline-flex; align-items:center; gap:.4rem;
      padding: .25rem .6rem;
      border-radius: 999px;
      border: 1px solid var(--pico-muted-border-color);
      font-size: .85rem;
      color: var(--pico-muted-color);
      background: var(--pico-card-background-color);
    }
    .dot { width:.55rem; height:.55rem; border-radius:999px; background: var(--pico-muted-color); display:inline-block; }
    .dot.ok { background: #2ecc71; }
    .dot.bad { background: #e74c3c; }

    .score {
      display:inline-flex;
      align-items:center;
      gap:.35rem;
      padding: .22rem .55rem;
      border-radius: 999px;
      border: 1px solid var(--pico-muted-border-color);
      font-size: .82rem;
      background: var(--pico-card-background-color);
      color: var(--pico-muted-color);
      white-space: nowrap;
    }
    .score .dot { width:.5rem; height:.5rem; }
    .score.good { border-color: rgba(46,204,113,.45); }
    .score.mid  { border-color: rgba(241,196,15,.55); }
    .score.bad  { border-color: rgba(231,76,60,.45); }

    details.card {
      border: 1px solid var(--pico-muted-border-color);
      border-radius: var(--pico-border-radius);
      background: var(--pico-card-background-color);
      padding: .9rem 1rem;
      margin: .85rem 0;
      box-shadow: 0 1px 0 rgba(0,0,0,.04);
    }

    .today {
      border-left: 4px solid var(--pico-primary);
      padding-left: .85rem;
      margin-top: .6rem;
    }
    .today h4 {
      margin: .25rem 0 .5rem;
      font-size: 1rem;
      letter-spacing: .01em;
    }
    .today .line { margin: .25rem 0; }
    .week {
      margin-top: .85rem;
      opacity: .85;
    }
    .week summary { color: var(--pico-muted-color); }
    .week pre.menu { opacity: .9; }

    .why {
      margin-top: .75rem;
    }
    .why summary { color: var(--pico-muted-color); }
    details.card summary {
      cursor: pointer;
      list-style: none;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 1rem;
      margin: 0;
    }
    details.card summary::-webkit-details-marker { display:none; }

    .titleRow { display:flex; align-items:center; gap:.6rem; min-width:0; flex-wrap:wrap; }
    .titleRow strong { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 60vw; }

    .sourceLink { font-size: .86rem; }

    .rightCol { display:flex; align-items:center; justify-content:flex-end; gap:.5rem; min-width: 2ch; }
    .todayPill {
      display:inline-block;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .04em;
      padding: .12rem .45rem;
      border-radius: 999px;
      border: 1px solid var(--pico-primary-border);
      color: var(--pico-primary);
    }
    pre.menu {
      white-space: pre-wrap;
      background: rgba(127,127,127,.08);
      border: 1px solid var(--pico-muted-border-color);
      border-radius: var(--pico-border-radius);
      padding: .9rem;
      margin-top: .75rem;
      font-size: .92rem;
      line-height: 1.35;
    }

    .gridTop {
      display:grid;
      grid-template-columns: 1fr;
      gap: .75rem;
      margin: 1rem 0 1.25rem;
    }
    @media (min-width: 700px) {
      .gridTop { grid-template-columns: 1.4fr .6fr; }
    }

    footer { margin: 2rem 0 2.5rem; }
  </style>
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>Lunch i Höör</h1>
      <p class="subtle">Snabb översikt av menyer i Höör. Dagens lunch lyfts upp, resten av veckan visas mer subtilt.</p>

      <div class="gridTop">
        <article style="margin:0">
          <div class="meta">
            <span class="badge" id="generatedAt"><span class="dot"></span> Laddar…</span>
            <span class="badge" id="count"></span>
            <span class="badge" id="okCount"></span>
          </div>
          <small class="subtle">Tips: klicka på ett ställe för att fälla ut menyn.</small>
        </article>

        <article style="margin:0">
          <label for="q">Sök</label>
          <input id="q" type="search" placeholder="Sök efter restaurang eller text…" autocomplete="off" />
          <small class="subtle" id="filterInfo"></small>
        </article>
      </div>
    </header>

    <section id="content" aria-live="polite"></section>

    <footer class="subtle">
      <small>
        Källor: respektive restaurangs webbplats (se länkar per ställe). Vissa menyer kan vara bild/OCR eller saknas.
      </small>
    </footer>
  </main>

<script>
function el(tag, attrs={}, children=[]) {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else n.setAttribute(k, v);
  }
  for (const c of children) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  return n;
}

function safeText(x){ return (x == null) ? '' : String(x); }

function statusBadge(r) {
  if (r.linkOnly) {
    const dot = el('span', { class: 'dot' });
    return el('span', { class: 'badge', title: 'Menyn kan inte l\u00e4sas automatiskt \u2013 f\u00f6lj l\u00e4nken' }, [dot, 'L\u00e4nk']);
  }
  if (r.ok && r.stale) {
    const dot = el('span', { class: 'dot ok' });
    const when = r.fetchedAt ? new Date(r.fetchedAt).toLocaleString('sv-SE') : 'ok\u00e4nt';
    return el('span', { class: 'badge', title: 'Senaste h\u00e4mtning misslyckades \u2013 visar data fr\u00e5n ' + when }, [dot, 'OK (\u00e4ldre data)']);
  }
  const dot = el('span', { class: 'dot ' + (r.ok ? 'ok' : 'bad') });
  const label = r.ok ? 'OK' : (r.error || 'fel');
  return el('span', { class: 'badge', title: label }, [dot, label]);
}

function asLink(url) {
  if (!url) return el('span', { class: 'subtle' }, ['']);
  try {
    var u = new URL(url);
    var host = u.hostname;
    var punycodeMap = {'xn--mrtenpizzeria-pfb.se': 'mårtenspizzeria.se'};
    if (punycodeMap[host]) host = punycodeMap[host];
    return el('a', { href: u.toString(), target: '_blank', rel: 'noreferrer', class: 'sourceLink' }, [host]);
  } catch(e) {
    return el('span', { class: 'subtle sourceLink' }, [url]);
  }
}

function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

function blueprintScoreLine(line){
  const s = safeText(line).toLowerCase();
  if (!s.trim()) return { score: null, why: [] };
  // Brunch/buffé kan inte scoreas – beror på vad man väljer
  if (/(brunch|buffé|bufféfrukost)/.test(s)) return { score: null, why: ['Buffé/brunch \u2013 score varierar beroende p\u00e5 vad du v\u00e4ljer'] };

  let score = 50;
  const why = [];
  const add = (pts, reason) => { score += pts; if (reason) why.push(reason); };

  // === POSITIVT (Blueprint-alignerat) ===
  // Baljväxter – daglig stapelvara (svarta linser, bönor)
  if (/(bön|bönor|lins|linser|kikärt|kikärtor|ärtor|ärta|hummus|humus)/.test(s)) add(+18, 'baljväxter');
  // Grönsaker – basen i Blueprint
  if (/(broccoli|blomkål|spenat|grönkål|sallad|ruccola|rucola|grönsak|tomat|gurk|paprika|morot|rotfrukt|fänkål|selleri|purjolök|zucchini|aubergine|mangold|kronärtskocka|betor|rödbeta|rödbets|sparris|pak choi)/.test(s)) add(+14, 'grönsaker');
  // Kål (separat – undvika falska matchningar)
  if (/\bkål\b/.test(s)) add(+5, 'kål');
  // Lök (som grönsak, inte som del av annat ord)
  if (/\blök\b/.test(s) && !/purjolök/.test(s)) add(+3, 'lök');
  // Svamp – daglig Blueprint-ingrediens
  if (/(svamp|champinjon|shiitake|karl johan)/.test(s)) add(+10, 'svamp');
  // Nötter & frön – Blueprint-pelare (valnötter, macadamia, frön)
  if (/(nötter|valnöt|macadamia|cashew|mandel|frö|frön|linfrö|sesamfrö|pinje)/.test(s)) add(+12, 'nötter/frön');
  // Olivolja / EVOO – primär fettkälla
  if (/(olivolja)/.test(s)) add(+10, 'olivolja');
  // Växtprotein (quorn, oumph, tofu, tempeh, falafel, bönbiff)
  if (/(quorn|oumph|tofu|tempeh|falafel|bönbiff|växtbaserad|vegansk)/.test(s)) add(+14, 'växtprotein');
  // Fullkorn – i måttlig mängd positivt
  if (/(quinoa|fullkorn|råg|havre|bulgur|bovete)/.test(s)) add(+5, 'fullkorn');
  // Fisk – räknas som plus här (Peters justering av protokollet)
  if (/(fisk|lax|torsk|kummel|kolja|regnbåge|sejfilé|sej|sill|sardiner|makrill|abborre|skaldjur|räk|musslor)/.test(s)) add(+10, 'fisk');
  // Bär – polyfenolrika, Blueprint-favorit
  if (/(blåbär|hallon|jordgubb|lingon|bär\b)/.test(s)) add(+8, 'bär');
  // Vitlök & ingefära – dagliga Blueprint-ingredienser
  if (/(vitlök|ingefära|gurkmeja)/.test(s)) add(+5, 'vitlök/ingefära');
  // Avokado – bra fett
  if (/(avokado)/.test(s)) add(+6, 'avokado');

  // === NEGATIVT (anti-Blueprint) ===
  // Friterat – pommes, chips, fritös (värst)
  if (/(friter|pommes|chips|fritös|stekt\s+i\s+olja)/.test(s)) add(-18, 'friterat');
  // Panerat – negativt men mildare än fritering
  if (/(panera)/.test(s) && !/(friter|pommes|chips|fritös)/.test(s)) add(-10, 'panerat');
  // Processat kött – helt uteslutet
  if (/(bacon|korv|köttbullar?|pannbiff|kebab|salami|skinka)/.test(s)) add(-18, 'processat kött');
  // Rött kött – uteslutet i Blueprint
  if (/(nötfärs|nötkött|biff|entrecôte|entrecote|oxfilé|oxkött|kalv|lamm|fläsk|karré|revben|ryggbiff|högrev|bog\b)/.test(s) && !/(bönbiff)/.test(s)) add(-14, 'rött kött');
  // Kyckling/fågel – räknas som litet plus här (Peters justering av protokollet)
  if (/(kyckling|kalkon|tupp|anka|fågel|höns)/.test(s)) add(+5, 'fågel');
  // Ägg – uteslutet i Blueprint
  if (/(\bägg\b|äggakaga|äggröra|omelett|stekt ägg|kokt ägg|pocherat ägg)/.test(s)) add(-7, 'ägg');
  // Tung mejeri – grädde, créme (helt uteslutet i Blueprint)
  if (/(grädd|cream|beurre|cr[eè]me|béarnaise|hollandaise)/.test(s)) add(-12, 'tung mejeri');
  // Smör / ost / lätt mejeri – garnering (mindre negativt)
  if (/(smör\b|ost\b|parmesan|mozzarella|burrata|ricotta|mascarpone|yoghurt)/.test(s)) add(-6, 'smör/ost');
  // Raffinerade kolhydrater – uteslutet
  if (/(pannkak|våffl|baguett|pizza|vitt bröd|focaccia|tortilla)/.test(s)) add(-12, 'raff. kolhydrater');
  // Pasta – negativt om inte fullkorn
  if (/\bpasta\b/.test(s) && !/fullkorn/.test(s)) add(-8, 'pasta');
  // Bröd – svagt negativt (kan vara fullkorn)
  if (/\bbröd\b/.test(s) && !/fullkorn/.test(s) && !/baguett|focaccia/.test(s)) add(-4, 'bröd');
  // Socker/sötsaker – helt uteslutet
  if (/(socker|sylt|glass|kaka|dessert|choklad|godis)/.test(s)) add(-14, 'socker');
  // Vit potatis – svagt negativt
  if (/(potatis|raggmunk)/.test(s) && !/sötpotatis/.test(s)) add(-2, 'potatis');
  // Sötpotatis – neutral till svagt positivt
  if (/(sötpotatis)/.test(s)) add(+3, 'sötpotatis');
  // Ris – svagt negativt om inte fullkorn
  if (/\bris\b/.test(s) && !/fullkorn/.test(s)) add(-4, 'vitt ris');
  // Sås – bara negativt om det signalerar mejeri/fett
  if (/(gräddsås|löksås|bearnaisesås|smörsås)/.test(s) && !/(grädd|smör)/.test(s)) add(-6, 'tung sås');

  score = clamp(Math.round(score), 0, 100);
  return { score, why };
}

function scoreBadge(score){
  if (score == null) return null;
  const cls = score >= 70 ? 'good' : score >= 50 ? 'mid' : 'bad';
  const dot = el('span', { class: 'dot ' + (score >= 70 ? 'ok' : score >= 50 ? '' : 'bad') });
  return el('span', { class: 'score ' + cls, title: 'Blueprint-match: ' + score + '%' }, [dot, score + '%']);
}

function truncate(s, n=140){
  s = safeText(s).replace(/\s+/g,' ').trim();
  if (s.length <= n) return s;
  return s.slice(0, n-1).trimEnd() + '…';
}

function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

function stockholmNow(){
  // Best-effort conversion without external libs.
  // Uses Intl to format in Europe/Stockholm.
  const parts = new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'Europe/Stockholm',
    year: 'numeric', month: '2-digit', day: '2-digit',
    weekday: 'long'
  }).formatToParts(new Date());
  const get = (t) => parts.find(p => p.type === t)?.value;
  const year = Number(get('year'));
  const month = Number(get('month'));
  const day = Number(get('day'));
  const weekday = (get('weekday') || '').toLowerCase();
  return { date: new Date(Date.UTC(year, month-1, day)), ymd: `${year}-${pad2(month)}-${pad2(day)}`, weekday };
}

const weekdaySv = ['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'];
const weekdaySvUpper = ['SÖNDAG','MÅNDAG','TISDAG','ONSDAG','TORSDAG','FREDAG','LÖRDAG'];

function normalizeMenuText(r){
  return safeText(r.ok ? (r.raw?.text || r.raw?.ocrText) : (r.raw?.note));
}

function parseAkersberg(text){
  // Matches: "Måndag 26/1 ..." style.
  const re = /(Måndag|Tisdag|Onsdag|Torsdag|Fredag|Lördag|Söndag)\s+(\d{1,2})\/(\d{1,2})\s*/g;
  const chunks = [];
  let m;
  while ((m = re.exec(text))){
    chunks.push({ idx: m.index, wd: m[1], d: Number(m[2]), mo: Number(m[3]) });
  }
  if (!chunks.length) return null;
  const out = {};
  for (let i=0;i<chunks.length;i++){
    const a = chunks[i];
    const b = chunks[i+1];
    const body = text.slice(a.idx + a.wd.length, b ? b.idx : text.length).trim();
    const key = `${a.d}/${a.mo}`;
    var clean = body.replace(/^\d{1,2}\/\d{1,2}/,'').trim();
    var footerIdx = clean.indexOf('Lunchmeny v.');
    if (footerIdx > 0) clean = clean.substring(0, footerIdx).trim();
    out[key] = clean;
  }
  return out;
}

function parseGastis(text){
  // OCR style: "TORSDAG: ..." and a separate "VEG." line.
  const dayRe = /^(MÅNDAG|TISDAG|ONSDAG|TORSDAG|FREDAG|LÖRDAG|SÖNDAG)\s*:\s*(.+)$/gmi;
  const out = {};
  let m;
  while ((m = dayRe.exec(text))){
    out[m[1].toUpperCase()] = m[2].trim();
  }
  const veg = (text.match(/\bVEG\.?\s*[:.]?\s*(.+)$/im) || [])[1]?.trim();
  return Object.keys(out).length ? { days: out, veg } : null;
}

function parseRalsen(text){
  // "DAGENS RÄTT - ONS 28/1 2026!\nPersiljekorv ..."
  const re = /DAGENS\s+RÄTT\s*-\s*([A-ZÅÄÖ]{3,7})\s*(\d{1,2})\/(\d{1,2})\s*(\d{4})?\s*!?/i;
  const m = text.match(re);
  if (!m) return null;
  const dd = Number(m[2]);
  const mm = Number(m[3]);
  // Find dish line right after match
  const after = text.slice(text.toUpperCase().indexOf(m[0].toUpperCase()) + m[0].length);
  const dish = after.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)[0] || '';
  return { dateKey: `${dd}/${mm}`, dish };
}

function parseMatokaka(text){
  var dayRe = /(M.ndag|Tisdag|Onsdag|Torsdag|Fredag|L.rdag|S.ndag):/gi;
  var matches = [];
  var m;
  while ((m = dayRe.exec(text))) matches.push({ day: m[1].toUpperCase(), idx: m.index + m[0].length });
  var out = {};
  // Parse weekday dishes
  for (var i = 0; i < matches.length; i++) {
    var end = (i + 1 < matches.length) ? matches[i+1].idx - matches[i+1].day.length - 1 : text.length;
    var dish = text.slice(matches[i].idx, end).split(String.fromCharCode(10)).join(' ').split(String.fromCharCode(13)).join('').trim();
    // Truncate at section headers that aren't day names
    var sectionStops = ['Hela veckan:', 'Helgmeny', 'Vi serverar', 'Med reservation', 'bottom of page'];
    for (var si2 = 0; si2 < sectionStops.length; si2++) {
      var cutIdx = dish.indexOf(sectionStops[si2]);
      if (cutIdx > 0) dish = dish.substring(0, cutIdx).trim();
    }
    if (dish && dish.toLowerCase() !== 'se påskmeny') out[matches[i].day] = dish;
  }
  // Parse helgmeny section – match the actual section (with "kl"), not the "se längre ner" header
  var helgMatch = text.match(/Helgmeny[:\s]*(\d{1,2})\s*-\s*(\d{1,2})\s+(januari|februari|mars|april|maj|juni|juli|augusti|september|oktober|november|december)\s+kl/i);
  if (!helgMatch) {
    // Fallback: try matching without "kl" but use the LAST occurrence
    var helgRe = /Helgmeny[:\s]*(\d{1,2})\s*-\s*(\d{1,2})\s+(januari|februari|mars|april|maj|juni|juli|augusti|september|oktober|november|december)/gi;
    var hm;
    while ((hm = helgRe.exec(text))) helgMatch = hm;
  }
  var helgDishes = [];
  if (helgMatch) {
    var helgIdx = text.indexOf(helgMatch[0]);
    var afterHelg = text.slice(helgIdx + helgMatch[0].length);
    // Stop at footer markers
    var stopIdx = afterHelg.length;
    var stopMarkers = ['Vi serverar alltid', 'Med reservation', 'bottom of page'];
    for (var si = 0; si < stopMarkers.length; si++) {
      var sIdx = afterHelg.indexOf(stopMarkers[si]);
      if (sIdx !== -1 && sIdx < stopIdx) stopIdx = sIdx;
    }
    var helgText = afterHelg.slice(0, stopIdx);
    // Extract dish lines (lines with prices like "235:-" or meaningful content)
    var helgLines = helgText.split(/[\n\r]+/).map(function(l){ return l.trim(); }).filter(Boolean);
    for (var hi = 0; hi < helgLines.length; hi++) {
      var hl = helgLines[hi];
      // Skip meta lines (opening hours, restaurant info)
      if (/^\s*(R\s*estaurangen|kl[,.]|\d{1,2}[,.]\d{2}\s*-)/i.test(hl)) continue;
      if (hl.length < 10) continue;
      // Keep dish lines (typically have price "XXX:-" or descriptive food text)
      if (/\d+:-/.test(hl) || /med |och |&/.test(hl)) {
        helgDishes.push(hl.replace(/\s*\d+:-\/?(\d+:-)?$/, '').trim());
      }
    }
    // Store helg info with dates
    var monthNames = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
    var helgMonth = monthNames.indexOf(helgMatch[3].toLowerCase()) + 1;
    var helgDayStart = parseInt(helgMatch[1]);
    var helgDayEnd = parseInt(helgMatch[2]);
    if (helgDishes.length > 0) {
      out['_helg'] = { dayStart: helgDayStart, dayEnd: helgDayEnd, month: helgMonth, dishes: helgDishes };
    }
  }
  return Object.keys(out).length ? out : null;
}

function parseElisefarm(text){
  var dayNames = ['MÅNDAG','TISDAG','ONSDAG','TORSDAG','FREDAG','LÖRDAG','SÖNDAG'];
  var lines = text.split(/  +/).map(function(l){return l.trim();}).filter(Boolean);
  var out = {};
  var currentDay = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var upper = line.toUpperCase().trim();
    var matched = dayNames.find(function(d){ return upper === d || upper.indexOf(d) === 0; });
    if (matched) {
      currentDay = matched;
      continue;
    }
    if (upper === 'VECKANS VEGETARISKA' || upper === 'WEEKLY VEGETARIAN') {
      currentDay = 'VEG';
      continue;
    }
    if (upper.indexOf('HELG') === 0 || upper.indexOf('WEEKEND') === 0 || upper.indexOf('HEMGJORDA') === 0 || upper.indexOf('HOMEMADE') === 0 || upper.indexOf('YNGRE') === 0 || upper.indexOf('EST.') !== -1 || upper.indexOf('VECKA') !== -1 || upper.indexOf('WEEK') !== -1 || upper.indexOf('DAGENS LUNCH') === 0 || upper.indexOf('TODAY') === 0 || upper.indexOf('SERVERAS') === 0 || upper.indexOf('ALWAYS') === 0 || upper.indexOf('ELISEFARM') !== -1 || upper.indexOf('ALLTID') === 0 || upper.indexOf('OST-') === 0 || upper.indexOf('CHARK') === 0 || upper.indexOf('FRITERAT HEMBAKT') === 0 || upper.indexOf('SKÅNSKA') === 0 || upper.indexOf('OLIVER') === 0 || upper.indexOf('VÄNLIGEN') === 0) {
      currentDay = null;
      continue;
    }
    if (currentDay && line.length > 3) {
      var existing = out[currentDay] || '';
      out[currentDay] = existing ? existing + ', ' + line : line;
    }
  }
  return Object.keys(out).length ? out : null;
}

function parseDaySections(text){
  var dayRe = /(m\u00e5ndag|tisdag|onsdag|torsdag|fredag|l\u00f6rdag|s\u00f6ndag)\s*[:\-.]?/gi;
  var matches = [];
  var m;
  while ((m = dayRe.exec(text))) matches.push({ day: m[1].toUpperCase(), idx: m.index, end: m.index + m[0].length });
  if (matches.length < 2) return null;
  var out = {};
  for (var i = 0; i < matches.length; i++) {
    var bodyEnd = (i + 1 < matches.length) ? matches[i + 1].idx : text.length;
    var body = text.slice(matches[i].end, bodyEnd).replace(/\s+/g, ' ').trim();
    if (body.length > 3 && !out[matches[i].day]) out[matches[i].day] = body;
  }
  return Object.keys(out).length >= 2 ? out : null;
}

function pickToday(r, now){
  if (r.linkOnly) {
    return { today: null, week: null, note: (r.raw && r.raw.note) || 'Menyn finns p\u00e5 restaurangens egen sida \u2013 f\u00f6lj l\u00e4nken' };
  }
  if (!r.ok) {
    if ((r.error || '').includes('facebook')) {
      return { today: null, week: null, note: 'Menyn finns bara p\u00e5 Facebook och kan inte h\u00e4mtas automatiskt. Bes\u00f6k restaurangens Facebook-sida.' };
    }
    return { today: null, week: null, note: r.raw?.note || 'Ingen maskinl\u00e4sbar meny \u00e4nnu' };
  }

  const text = normalizeMenuText(r);
  const day = now.date;
  const dd = day.getUTCDate();
  const mm = day.getUTCMonth()+1;
  const key = dd + '/' + mm;
  const wdUpper = weekdaySvUpper[weekdaySv.indexOf(now.weekday)] || '';

  const sourceType = r.source?.type || '';

  if (sourceType.includes('akersberg')){
    const map = parseAkersberg(text);
    if (!map) return { today: null, week: text, note: null };
    const todayRaw = map[key] || null;
    const today = todayRaw ? todayRaw.replace(/\s*Vegetarisk:\s*/gi, '\nVegetarisk: ') : null;
    return { today, week: Object.entries(map).map(([k,v])=>k+': '+v).join('\n\n'), note: null };
  }

  if (sourceType.includes('gastis')){
    const parsed = parseGastis(text);
    if (!parsed) return { today: null, week: text, note: null };
    const todayMain = wdUpper ? parsed.days[wdUpper] : null;
    const today = todayMain ? [todayMain, parsed.veg ? 'Veg: '+parsed.veg : null].filter(Boolean).join('\n') : null;
    const week = Object.entries(parsed.days)
      .map(([k,v]) => k[0] + k.slice(1).toLowerCase() + ': ' + v)
      .join('\n');
    return { today, week, note: todayMain ? null : 'Ingen lunch serveras idag' };
  }

  if (sourceType.includes('ralsen')){
    const parsed = parseRalsen(text);
    const isToday = parsed && parsed.dateKey === key;
    const today = isToday ? parsed.dish : null;
    const week = text;
    return { today, week, note: isToday ? null : 'Ingen uppdaterad dagsr\u00e4tt f\u00f6r idag (senast: '+(parsed?.dateKey || 'ok\u00e4nt datum')+')' };
  }

  if (sourceType === 'kreta-html' || sourceType === 'eatsmart-api' || sourceType === 'wp-api') {
    return { today: null, week: text, note: 'Fast lunchmeny (ej dagsr\u00e4tt)' };
  }

  if (sourceType === 'elisefarm-pdf') {
    var parsed = parseElisefarm(text);
    if (parsed) {
      var todayDish = wdUpper ? parsed[wdUpper] : null;
      var vegDish = parsed['VEG'] || null;
      var todayFull = todayDish ? [todayDish, vegDish ? 'Veg: ' + vegDish : null].filter(Boolean).join(String.fromCharCode(10)) : null;
      var weekParts = [];
      var keys = Object.keys(parsed);
      for (var ei = 0; ei < keys.length; ei++) {
        weekParts.push(keys[ei][0] + keys[ei].slice(1).toLowerCase() + ': ' + parsed[keys[ei]]);
      }
      return { today: todayFull, week: weekParts.join(String.fromCharCode(10)) || text, note: todayDish ? null : 'Ingen lunch serveras idag' };
    }
    return { today: null, week: text, note: null };
  }

  if (sourceType === 'wix-site') {
    var parsed = parseMatokaka(text);
    if (parsed) {
      var isWeekend = (wdUpper === 'LÖRDAG' || wdUpper === 'SÖNDAG');
      var todayDish = null;
      if (isWeekend && parsed['_helg']) {
        var helg = parsed['_helg'];
        if (dd >= helg.dayStart && dd <= helg.dayEnd && mm === helg.month) {
          todayDish = helg.dishes.join(String.fromCharCode(10));
        }
      } else if (!isWeekend) {
        todayDish = wdUpper ? parsed[wdUpper] : null;
      }
      var weekParts = [];
      var keys = Object.keys(parsed);
      for (var wi = 0; wi < keys.length; wi++) {
        if (keys[wi] === '_helg') {
          var h = parsed['_helg'];
          weekParts.push('Helgmeny (' + h.dayStart + '-' + h.dayEnd + '/' + h.month + '):' + String.fromCharCode(10) + h.dishes.join(String.fromCharCode(10)));
        } else {
          weekParts.push(keys[wi][0] + keys[wi].slice(1).toLowerCase() + ': ' + parsed[keys[wi]]);
        }
      }
      var note = null;
      if (!todayDish) {
        note = isWeekend ? 'Ingen helgmeny denna helg' : 'Ingen lunch serveras idag';
      }
      return { today: todayDish || null, week: weekParts.join(String.fromCharCode(10) + String.fromCharCode(10)) || text, note: note };
    }
  }

  if (sourceType === 'facebook-apify') {
    var fbDays = parseDaySections(text);
    if (fbDays && wdUpper && fbDays[wdUpper]) {
      var fbWeekParts = [];
      var fbKeys = Object.keys(fbDays);
      for (var fi = 0; fi < fbKeys.length; fi++) {
        fbWeekParts.push(fbKeys[fi][0] + fbKeys[fi].slice(1).toLowerCase() + ': ' + fbDays[fbKeys[fi]]);
      }
      return { today: fbDays[wdUpper], week: fbWeekParts.join(String.fromCharCode(10)), note: null };
    }
    // No day structure: if the post is from today, treat the whole post as today's menu.
    var postedAt = r.raw && r.raw.postedAt ? r.raw.postedAt : null;
    var postedYmd = null;
    if (postedAt) {
      try {
        var pp = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Stockholm', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(postedAt));
        postedYmd = pp;
      } catch (e) { postedYmd = null; }
    }
    if (postedYmd && postedYmd === now.ymd) {
      return { today: text, week: null, note: null };
    }
    var postedNote = postedAt ? 'Senaste Facebook-inl\u00e4gget (' + (postedYmd || '') + ') \u2013 kan vara \u00e4ldre \u00e4n idag' : 'Senaste Facebook-inl\u00e4gget \u2013 datum ok\u00e4nt';
    return { today: null, week: text, note: postedNote };
  }

  return { today: null, week: text, note: null };
}


function render(results, q='') {
  const root = document.getElementById('content');
  root.innerHTML = '';

  const query = q.trim().toLowerCase();
  const filtered = !query ? results : results.filter(r => textForResult(r).toLowerCase().includes(query));
  document.getElementById('filterInfo').textContent = query ? `Visar ${filtered.length} av ${results.length}` : '';

  const now = stockholmNow();

  // Pre-compute today's dish and score, then sort
  const enriched = filtered.map(r => {
    const picked = pickToday(r, now);
    const hasToday = Boolean(picked.today);
    const todayLines = (picked.today || '').split(String.fromCharCode(10)).map(s=>s.trim()).filter(Boolean);
    const scored = todayLines.map(line => ({ line, ...blueprintScoreLine(line) })).filter(x => x.score != null);
    const bestScore = scored.length ? Math.max(...scored.map(x => x.score)) : -1;
    return { r, picked, hasToday, bestScore };
  });
  enriched.sort((a, b) => {
    // 1. Has today's dish first
    if (a.hasToday !== b.hasToday) return a.hasToday ? -1 : 1;
    // 2. OK status before errors
    if (a.r.ok !== b.r.ok) return a.r.ok ? -1 : 1;
    // 3. Highest score first
    return b.bestScore - a.bestScore;
  });

  for (const { r, picked } of enriched) {
    const title = r.placeName || r.placeId || 'Okänt ställe';
    const src = r.source?.pageUrl || r.source?.url || r.raw?.url || '';


    const todayLines = (picked.today || '').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const scored = todayLines.map(line => ({ line, ...blueprintScoreLine(line) })).filter(x => x.score != null);
    const bestScore = scored.length ? Math.max(...scored.map(x => x.score)) : null;
    const hasToday = Boolean(picked.today);

    const details = el('details', { class: 'card', open: false }, [
      el('summary', {}, [
        el('div', { class: 'titleRow' }, [
          el('strong', {}, [title]),
          asLink(src),
          statusBadge(r),
          ...(hasToday ? [el('span', { class: 'todayPill', title: 'Har tydlig dagens lunch' }, ['IDAG'])] : []),
          ...(bestScore != null ? [scoreBadge(bestScore)] : [])
        ]),
        el('div', { class: 'rightCol' }, [
          el('span', { class: 'subtle' }, [''])
        ])
      ]),

      el('div', { class: 'today' }, [
        el('h4', {}, ['Dagens lunch']),
        ...(picked.today
          ? todayLines.map(line => {
              const s = blueprintScoreLine(line);
              const badge = scoreBadge(s.score);
              return el('div', { class: 'line' }, [
                ...(badge ? [badge, ' '] : []),
                line
              ]);
            })
          : [el('div', { class: 'subtle line' }, [picked.note || 'Ingen tydlig “dagens” hittad i menyn'])]
        )
      ]),

      ...(r.linkOnly ? [] : [el('details', { class: 'why' }, [
        el('summary', {}, ['Varför denna score? (klicka)']),
        el('div', { class: 'subtle', style: 'margin-top:.5rem' }, [
          'Score är en heuristik mot Bryan Johnsons Blueprint-protokoll: 100% = helt i linje (baljväxter, grönsaker, svamp, nötter/frön, bär, olivolja), fallande för avvikelser (rött/processat kött, ägg, mejeri, friterat, socker, raffinerade kolhydrater). Lokal justering: fisk och kyckling räknas som plus.'
        ]),
        ...(scored.length
          ? scored.map(x => el('div', { class: 'subtle', style: 'margin-top:.35rem' }, [
              `${x.score}% – ${x.line}`,
              x.why?.length ? ` (signal: ${x.why.join(', ')})` : ''
            ]))
          : [el('div', { class: 'subtle', style: 'margin-top:.35rem' }, ['Ingen scoring (saknar tydliga rader).'])]
        )
      ])]),

      ...(r.linkOnly ? [] : [el('details', { class: 'week' }, [
        el('summary', {}, ['Resten av veckan / detaljer']),
        el('pre', { class: 'menu' }, [picked.week || normalizeMenuText(r) || ''])
      ])])
    ]);

    root.appendChild(details);
  }
}

async function main(){
  // Relative path so GitHub Pages (served under /<repo>/) works.
  const res = await fetch('data/menus.json', { cache: 'no-store' });
  const json = await res.json();

  const results = (json.results || []).slice().sort((a,b) =>
    safeText(a.placeName || a.placeId).localeCompare(safeText(b.placeName || b.placeId), 'sv')
  );

  const ok = results.filter(r => r.ok).length;

  const gen = json.generatedAt ? new Date(json.generatedAt) : null;
  document.getElementById('generatedAt').textContent = 'Genererad: ' + (gen ? gen.toLocaleString('sv-SE') : '?');
  document.getElementById('count').textContent = 'Ställen: ' + results.length;
  document.getElementById('okCount').textContent = 'OK: ' + ok + ' / ' + results.length;

  const q = document.getElementById('q');
  q.addEventListener('input', () => render(results, q.value));

  render(results, '');
}

main().catch(err => {
  const root = document.getElementById('content');
  root.innerHTML = '';
  root.appendChild(el('article', {}, [
    el('h3', {}, ['Fel']),
    el('p', { class: 'subtle' }, [String(err)])
  ]));
});
</script>
