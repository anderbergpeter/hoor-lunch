name: Update lunch menus

on:
  workflow_dispatch:
  schedule:
    # Weekdays 10:30 Europe/Stockholm (08:30 UTC in summer, 09:30 UTC in winter)
    - cron: '30 8 * * 1-5'
    # Weekdays 06:30 Europe/Stockholm (early update for early risers)
    - cron: '30 4 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-menus
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Fetch menus
        run: npm run fetch

      - name: Copy menus into GitHub Pages folder
        run: |
          mkdir -p docs/data
          cp -f data/menus.json docs/data/menus.json

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- docs/data/menus.json; then
            echo "No changes to menus.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/menus.json
          git commit -m "chore: update menus.json [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git push
