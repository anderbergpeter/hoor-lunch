name: Update lunch menus

on:
  workflow_dispatch:
  schedule:
    # Weekdays 06:30 Europe/Stockholm (early update)
    - cron: '30 4 * * 1-5'
    # Weekdays 10:30 Europe/Stockholm
    - cron: '30 8 * * 1-5'
    # Friday 16:00 Europe/Stockholm (catch weekend menu updates)
    - cron: '0 14 * * 5'
    # Saturday 08:30 Europe/Stockholm (fresh weekend data)
    - cron: '30 6 * * 6'
    # Sunday 08:30 Europe/Stockholm (weekend menus, e.g. MAT & KaKa helgmeny)
    - cron: '30 6 * * 0'
    # Monday 12:30 Europe/Stockholm (extra retry - many places publish the new week late Monday morning)
    - cron: '30 10 * * 1'

permissions:
  contents: write

concurrency:
  group: update-menus
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Fetch menus
        run: npm run fetch
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

      - name: Copy menus into GitHub Pages folder
        run: |
          mkdir -p docs/data
          cp -f data/menus.json docs/data/menus.json

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- docs/data/menus.json; then
            echo "No changes to menus.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/menus.json
          git commit -m "chore: update menus.json [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git push
