<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lunch i Höör</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:16px;max-width:900px}
    h1{margin:0 0 8px}
    .muted{color:#666}
    .card{border:1px solid #ddd;border-radius:10px;padding:12px;margin:12px 0}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .pill{display:inline-block;padding:2px 8px;border:1px solid #ccc;border-radius:999px;font-size:12px;color:#444}
    pre{background:#f7f7f7;padding:10px;border-radius:8px;overflow:auto}
  </style>
</head>
<body>
  <h1>Lunch i Höör</h1>
  <div class="muted">Visar veckomenyer (auto-uppdatering måndagar 10:00).</div>

  <div class="card">
    <div class="row">
      <span class="pill" id="generatedAt">Laddar…</span>
      <span class="pill" id="count"></span>
    </div>
  </div>

  <div id="content" class="card"><pre id="raw"></pre></div>

<script>
async function main(){
  const res = await fetch('/data/menus.json', { cache: 'no-store' });
  const json = await res.json();
  document.getElementById('generatedAt').textContent = 'Genererad: ' + (json.generatedAt || '?');
  document.getElementById('count').textContent = 'Ställen: ' + (json.results?.length || 0);
  document.getElementById('raw').textContent = JSON.stringify(json, null, 2);
}
main().catch(err => {
  document.getElementById('raw').textContent = String(err);
});
</script>
</body>
</html>
